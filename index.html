<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeSlider</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/img/shoe-svgrepo-com.svg">

</head>

<body>
    <div class="container">
        <div class="carousel">
            <div class="container-slides">
                <ul class="slides">
                    <li class="slide active"></li>
                    <li class="slide"></li>
                    <li class="slide"></li>
                    <li class="slide"></li>
                    <li class="slide"></li>
                </ul>
                <div class="controlls">
                    <button class="btn btn-prev">Prev</button>
                    <button class="btn btn-pause">Pause</button>
                    <button class="btn btn-next">Next</button>
                </div>
                <div class="indicators-container">
                    <div class="indicator active" data-slide-to="0"></div>
                    <div class="indicator" data-slide-to="1"></div>
                    <div class="indicator" data-slide-to="2"></div>
                    <div class="indicator" data-slide-to="3"></div>
                    <div class="indicator" data-slide-to="4"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
